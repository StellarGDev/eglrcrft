<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eaglercraft Launcher</title>
<style>
:root{--bg:#17191c;--side:#202327;--panel:#25292e;--panel2:#30353b;--line:#3d4249;--txt:#f3f4f5;--muted:#aeb4bb;--green:#3c8527;--green2:#2d681e;--lime:#75bd4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px "Segoe UI",Arial,sans-serif}
button,select{font:inherit}button{cursor:pointer}
.shell{min-height:100vh;display:grid;grid-template-columns:76px 1fr}
.sidebar{background:var(--side);border-right:1px solid #111;display:flex;flex-direction:column;align-items:center;padding:15px 0;gap:9px}
.mark{width:43px;height:43px;margin:2px 0 24px;background:#3b842b;border:2px solid #8bc66b;display:grid;place-items:center;font-size:24px;box-shadow:inset 0 0 0 3px #285d1d}
.nav{width:60px;height:58px;background:none;border:0;border-left:3px solid transparent;color:#aeb4bb;font-size:20px}
.nav span{display:block;font-size:9px;letter-spacing:.5px;margin-top:4px}.nav:hover{background:#30353b;color:white}.nav.active{color:#fff;background:#30353b;border-left-color:#7bc454}
.bottom{margin-top:auto}.main{min-width:0}.top{height:57px;background:#202327;border-bottom:1px solid #111;display:flex;align-items:center;justify-content:space-between;padding:0 23px}
.topbrand{font-weight:700;letter-spacing:.7px}.profile{display:flex;align-items:center;gap:9px;color:#d6d9dc}.avatar{width:30px;height:30px;background:#467f34;border:1px solid #86bd68;display:grid;place-items:center}
.content{max-width:1500px;margin:auto;padding:24px 27px 40px}.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.pagehead h1{font-size:24px;margin:0}
.hero{height:390px;position:relative;overflow:hidden;background:#293b4b;border:1px solid #42484f}
.hero img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.76)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.82),rgba(0,0,0,.28) 56%,transparent),linear-gradient(0deg,rgba(0,0,0,.42),transparent 45%)}
.heroText{position:absolute;z-index:1;left:42px;top:50%;transform:translateY(-50%);max-width:510px}
.kicker{color:#c7e7b8;text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700}
.hero h2{font-size:clamp(35px,5vw,58px);line-height:1;margin:13px 0;text-shadow:2px 3px #222}
.hero p{font-size:15px;line-height:1.55;color:#eee;max-width:430px}
.actions{display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.play{background:linear-gradient(#75bd4b,#3b8526);border:1px solid #9bd47c;color:#fff;font-weight:800;letter-spacing:1px;padding:13px 44px;font-size:17px;box-shadow:0 3px 0 #214e17;text-shadow:1px 1px #254b1a}
.play:hover{filter:brightness(1.12)}.muted{color:var(--muted);font-size:12px}
.tiles{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:15px;margin-top:18px}
.tile{background:var(--panel);border:1px solid var(--line);min-height:140px;display:flex;overflow:hidden}
.tile img{width:38%;object-fit:cover}.tiletext{padding:16px}.tile h3{margin:0 0 7px;font-size:16px}.tile p{margin:0 0 12px;color:var(--muted);font-size:12px;line-height:1.5}
.link{border:0;background:none;color:#a9d98e;padding:0;font-size:12px}.link:hover{text-decoration:underline}
.sectionTitle{font-size:24px;margin:4px 0 20px}.panel{background:var(--panel);border:1px solid var(--line);padding:20px;margin-bottom:15px}.panel h2{font-size:17px;margin:0 0 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:13px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.row p{margin:4px 0 0;color:var(--muted);font-size:12px}.btn{background:#41474e;border:1px solid #69717a;color:#fff;padding:9px 14px}.btn:hover{background:#50575f}.btn.green{background:var(--green);border-color:#76ad58}.btn.green:hover{background:#4a9a31}
select{background:#17191c;color:#fff;border:1px solid #626970;padding:9px;min-width:190px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.news{background:var(--panel);border:1px solid var(--line);overflow:hidden}.news img{width:100%;height:150px;object-fit:cover;display:block}.news div{padding:15px}.news h3{margin:0 0 8px}.news p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.skin{height:170px;width:115px;margin:14px auto 20px;position:relative}.skin .head{height:48px;width:48px;margin:auto;background:#c89a70;border:5px solid #5d3929}.skin .body{height:65px;width:58px;margin:auto;background:#2375a8;border:5px solid #174c70}.skin .legs{display:flex;justify-content:center;gap:5px}.skin .legs i{width:25px;height:52px;background:#303d78;border:4px solid #202953}
.note{color:#9da4ac;font-size:11px;margin-top:18px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,18px);opacity:0;background:#30353b;border:1px solid #69717a;padding:11px 16px;transition:.2s;z-index:5;box-shadow:0 5px 20px #0008}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:850px){.shell{grid-template-columns:61px 1fr}.nav{width:52px}.content{padding:15px}.hero{height:390px}.heroText{left:22px;right:15px}.tiles{grid-template-columns:1fr}.top{padding:0 13px}}

</style></head><body>

const root=document.getElementById('content'),toastBox=document.getElementById('toast');
const versions=[
 {name:'26.2',url:'https://slungus57.github.io/eaglercraft/',detail:'Eaglercraft 26.2'},
 {name:'26.2 Rise Client',url:'https://cloudyicewater.github.io/Riseeeeeiey/',detail:'Eaglercraft 26.2 · Rise Client'},
 {name:'1.12.2',url:'https://stellargdev.github.io/eaglerunblocked/',detail:'Eaglercraft 1.12.2'},
 {name:'1.12.2 with LAN',url:'https://stellargdev.github.io/eglrcrftunblocked/',detail:'Eaglercraft 1.12.2 · LAN enabled'},
 {name:'1.8.8',url:'https://stellargdev.github.io/eaglercraft1-8/',detail:'Eaglercraft 1.8.8'}
];
let selected=0;
function toast(s){toastBox.textContent=s;toastBox.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>toastBox.classList.remove('show'),3000)}
function versionOptions(){return versions.map((v,i)=>`<option value="${i}" ${i===selected?'selected':''}>${v.name}</option>`).join('')}
function openSelected(){
 const v=versions[selected];
 // Load the game as a top-level page. Remote hosts can block iframe embedding
 // with X-Frame-Options or CSP, which a launcher cannot override.
 window.location.assign(v.url);
}
function go(page){
 document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));
 ({play,installations,news}[page])();
}
function bindSelector(){
 const sel=document.getElementById('versionSelect');
 if(sel) sel.addEventListener('change',e=>{selected=Number(e.target.value);const d=document.getElementById('selectedDetail');if(d)d.textContent=versions[selected].detail;});
}
function play(){
 root.innerHTML=`
 <div class="pagehead"><h1>Play</h1><span class="muted">EAGLERCRAFT</span></div>
 <section class="hero"><img src="${art[0]}" alt="Minecraft landscape artwork"><div class="heroText">
 <h2>YOUR WORLD.<br>YOUR ADVENTURE.</h2>
 <p>Choose a version of Eaglercraft and jump into a block-building adventure.</p>
 <div class="actions">
 <button class="play" id="launch">▶ &nbsp; PLAY</button>
 <div><select id="versionSelect" aria-label="Select game version">${versionOptions()}</select><div class="muted" id="selectedDetail" style="margin-top:6px">${versions[selected].detail}</div></div>
 </div></div></section>
 <div class="tiles">
 <article class="tile"><img src="${art[4]}" alt="Minecraft artwork"><div class="tiletext"><h3>Explore and create</h3><p>Build, explore, and shape your own blocky world.</p><button class="link" data-go="news">Latest news →</button></div></article>
 <article class="tile"><img src="${art[2]}" alt="Minecraft artwork"><div class="tiletext"><h3>Choose your version</h3><p>Switch between Eaglercraft versions and clients.</p><button class="link" data-go="installations">All versions →</button></div></article>
 <article class="tile"><img src="${art["chaos_cubed"]}" alt="Colorful block-world Chaos Cubed artwork"><div class="tiletext"><h3>Play your way</h3><p>Classic and newer Eaglercraft experiences in one place.</p><button class="link" data-go="installations">Select a version →</button></div></article>
 </div>
 <p class="note">Press PLAY to open the selected game directly. Some game hosts block iframe embedding, so the game must run as its own page. Use your browser's fullscreen control (usually F11) or the game's fullscreen button.</p>`;
 bindSelector();
 document.getElementById('launch').onclick=openSelected;
 root.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));
}
function installations(){
 root.innerHTML=`<h1 class="sectionTitle">Game versions</h1>
 <div class="panel"><h2>Select an Eaglercraft version</h2>
 ${versions.map((v,i)=>`<div class="row"><div><b>${v.name}</b><p>${v.detail}</p></div><button class="btn ${i===selected?'green':''}" data-select="${i}">${i===selected?'Selected':'Select'}</button></div>`).join('')}
 </div><p class="note">Choose a version here, then return to Play and press PLAY to open it directly.</p>`;
 root.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.select);installations();toast('Selected '+versions[selected].name)});
}
function news(){
 const stories=[["New worlds to explore", "Set out across new landscapes, discover resources, and find the perfect place to build.", art["wilderness"]], ["Tiny Takeover", "Meet the tiny creatures and enjoy the playful side of the blocky world.", art["tiny_takeover"]], ["Baby axolotls", "Add a splash of color with these adorable aquatic creatures.", art["axolotl"]], ["Baby bees", "A cheerful wallpaper celebrating the little pollinators of the world.", art["bee"]], ["Chaos Cubed", "A colorful new world of blocky adventure awaits.", art["chaos_cubed"]], ["Build something incredible", "From a simple starter shelter to a huge castle, your next creation starts one block at a time.", art[4]], ["Choose your era", "Try different Eaglercraft versions, from classic 1.8.8 to newer 1.12.2 and 26.2 experiences.", art[2]], ["Make every world yours", "Gather materials, experiment with designs, and create your own adventures.", art[0]]];
 root.innerHTML=`<h1 class="sectionTitle">News & Discover</h1><div class="gallery">${stories.map((n,i)=>`<article class="news"><img src="${n[2]}" alt=""><div><h3>${n[0]}</h3><p>${n[1]}</p></div></article>`).join('')}</div>`;
}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
play();
</script></body></html>
